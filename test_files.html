<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple AppData Tester</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <h2>1. Authentication</h2>
    <button id="authBtn">Connect Google Account</button>
    <p>Status: <b id="authStatus" style="color:red">Disconnected</b></p>

    <hr>

    <h2>2. Upload File (any type of file)</h2>
    <input type="file" id="fileInput" />
    <button id="uploadBtn" disabled>Upload File to Hidden Folder</button>
    <p>Generated File ID: <span id="targetFileId" style="font-family:monospace; font-weight:bold;">None</span></p>

    <hr>

    <h2>3. Available Files in AppData Folder</h2>
    <button id="listBtn" disabled>List All Files</button>
    <ul id="fileList" style="margin-top: 10px; max-height: 150px; overflow-y: auto; padding-left: 20px;">
        <li style="color: gray; list-style-type: none;">No files loaded yet. Click 'List All Files'.</li>
    </ul>

    <hr>

    <h2>4. Fetch & Preview</h2>
    <input type="text" id="manualFileIdInput" placeholder="Paste or click a file ID above" style="width: 300px;" />
    <button id="previewBtn" disabled>Fetch Image</button>
    
    <div style="margin-top: 15px; border: 1px solid #ccc; width: 300px; height: 200px; display: flex; align-items: center; justify-content: center;">
        <img id="previewImage" style="max-width: 100%; max-height: 100%; display: none;" alt="Preview" />

        <div id="jsonTitle"
             style="display:none;
                    margin-top:15px;
                    margin-bottom:8px;
                    font-weight:bold;
                    font-size:16px;">
            JSON Preview
        </div>
        <pre id="jsonPreview"
            style="
                display:none;
                width:100%;
                max-width:900px;
                min-height:250px;
                max-height:600px;
                overflow:auto;
                box-sizing:border-box;
                padding:16px;
                margin-top:15px;
                border:1px solid #ccc;
                border-radius:8px;
                background:#f8f9fa;
                color:#222;
                font-family:Consolas, Monaco, 'Courier New', monospace;
                font-size:14px;
                line-height:1.5;
                white-space:pre;
                word-break:break-word;
                box-shadow:0 2px 8px rgba(0,0,0,0.08);
            "></pre>
    </div>
    <div id="jsonModal"
         style="
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.5);
            z-index:9999;
            align-items:center;
            justify-content:center;
        ">
    
        <div style="
            width:90vw;
            height:90vh;
            background:white;
            border-radius:8px;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.4);
        ">
    
            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                padding:12px 16px;
                border-bottom:1px solid #ddd;
                font-size:18px;
                font-weight:bold;
            ">
                <span id="jsonModalTitle">JSON Preview</span>
    
                <button id="closeJsonModal"
                        style="
                            font-size:20px;
                            cursor:pointer;
                            border:none;
                            background:none;
                        ">
                    ✕
                </button>
            </div>
    
            <pre id="jsonModalContent"
                 style="
                    flex:1;
                    margin:0;
                    padding:20px;
                    overflow:auto;
                    font-family:Consolas, Monaco, monospace;
                    font-size:14px;
                    line-height:1.5;
                    background:#f8f8f8;
                    white-space:pre;
                "></pre>
    
        </div>
    
    </div>

    <script>
        // ---------- GLOBAL STATE ----------
        const CLIENT_ID = '592330790483-lc90hejib7bng3to68e02d6vubb27fin.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/calendar.events';

        let tokenClient;
        let accessToken = null;
        let silentRefreshPromise = null;
        let tokenExpiry = 0;

        // ---------- DOM ELEMENTS ----------
        const authBtn = document.getElementById('authBtn');
        const authStatus = document.getElementById('authStatus');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const targetFileId = document.getElementById('targetFileId');
        const listBtn = document.getElementById('listBtn');
        const fileList = document.getElementById('fileList');
        const manualFileIdInput = document.getElementById('manualFileIdInput');
        const previewBtn = document.getElementById('previewBtn');
        const previewImage = document.getElementById('previewImage');
        const jsonPreview = document.getElementById('jsonPreview');
        const jsonTitle = document.getElementById("jsonTitle");
        const jsonModal = document.getElementById("jsonModal");
        const jsonModalContent = document.getElementById("jsonModalContent");
        const jsonModalTitle = document.getElementById("jsonModalTitle");
        const closeJsonModal = document.getElementById("closeJsonModal");


        closeJsonModal.onclick = () => {
            jsonModal.style.display = "none";
        };
        jsonModal.onclick = (e) => {
            if (e.target === jsonModal) {
                jsonModal.style.display = "none";
            }
        };
        document.addEventListener("keydown", e => {
            if (e.key === "Escape") {
                jsonModal.style.display = "none";
            }
        });
        // ---------- TOKEN HANDLING ----------
        function ensureValidToken() {
            if (accessToken && Date.now() < tokenExpiry) {
                return Promise.resolve(accessToken);
            }
            if (!silentRefreshPromise) {
                silentRefreshPromise = new Promise((resolve, reject) => {
                    tokenClient.requestAccessToken({ prompt: '' });
                    const originalCallback = tokenClient.callback;
                    tokenClient.callback = (response) => {
                        tokenClient.callback = originalCallback;
                        if (response.error) {
                            tokenClient.requestAccessToken({ prompt: 'consent' });
                            reject(new Error('Silent refresh failed'));
                        } else {
                            accessToken = response.access_token;
                            tokenExpiry = Date.now() + (response.expires_in - 60) * 1000;
                            resolve(accessToken);
                        }
                        silentRefreshPromise = null;
                    };
                });
            }
            return silentRefreshPromise;
        }

        // ---------- INIT GOOGLE IDENTITY ----------
        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.error) {
                        alert("Authentication failed!");
                        return;
                    }
                    accessToken = response.access_token;
                    tokenExpiry = Date.now() + (response.expires_in - 60) * 1000;
                    
                    authStatus.textContent = "Connected";
                    authStatus.style.color = "green";
                    uploadBtn.disabled = false;
                    listBtn.disabled = false;
                    previewBtn.disabled = false;
                },
            });
            tokenClient.requestAccessToken({ prompt: '' });
        };

        authBtn.addEventListener('click', () => {
            tokenClient.requestAccessToken({ prompt: 'consent' });
        });

        // ---------- API LOGIC ----------
        async function uploadFileToAppData(fileBlob, fileName) {
            const token = await ensureValidToken();
            const metadata = { name: fileName, parents: ['appDataFolder'] };

            const formData = new FormData();
            formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            formData.append('file', fileBlob);

            const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if (!response.ok) throw new Error("Upload request failed.");
            const data = await response.json();
            return data.id;
        }

        async function deleteFile(fileId) {
            const token = await ensureValidToken();
        
            const response = await fetch(
                `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}`,
                {
                    method: 'DELETE',
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );
        
            if (!response.ok) {
                throw new Error(await response.text());
            }
        }

        async function renameFile(fileId, newName) {
            const token = await ensureValidToken();
        
            const response = await fetch(
                `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}`,
                {
                    method: 'PATCH',
                    headers: {
                        Authorization: `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: newName
                    })
                }
            );
        
            if (!response.ok) {
                throw new Error(await response.text());
            }
        
            return await response.json();
        }


        async function duplicateFile(file) {
            const token = await ensureValidToken();
        
            // Download the original
            const downloadResponse = await fetch(
                `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(file.id)}?alt=media`,
                {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );
        
            if (!downloadResponse.ok) {
                throw new Error(await downloadResponse.text());
            }
        
            const blob = await downloadResponse.blob();
        
            // Upload the copy
            const metadata = {
                name: `Copy of ${file.name}`,
                parents: ["appDataFolder"]
            };
        
            const formData = new FormData();
            formData.append(
                "metadata",
                new Blob([JSON.stringify(metadata)], {
                    type: "application/json"
                })
            );
            formData.append("file", blob, `Copy of ${file.name}`);
        
            const uploadResponse = await fetch(
                "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
                {
                    method: "POST",
                    headers: {
                        Authorization: `Bearer ${token}`
                    },
                    body: formData
                }
            );
        
            if (!uploadResponse.ok) {
                throw new Error(await uploadResponse.text());
            }
        
            return await uploadResponse.json();
        }
        
        async function listAppDataFiles() {
            const token = await ensureValidToken();
            // spaces must target 'appDataFolder' explicitly in the search query
        const url =
            'https://www.googleapis.com/drive/v3/files' +
            '?spaces=appDataFolder' +
            '&fields=files(id,name,size,mimeType,createdTime,modifiedTime)' +
            '&pageSize=100';
            
            const response = await fetch(url, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) throw new Error("Failed to list files.");
            const data = await response.json();
            return data.files || [];
        }

        async function fetchImageFromAppData(fileId) {
            const token = await ensureValidToken();
            const response = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) throw new Error("Fetch request failed.");
            return await response.blob();
        }


        async function fetchFile(fileId) {
            const token = await ensureValidToken();
        
            const response = await fetch(
                `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`,
                {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );
        
            if (!response.ok)
                throw new Error(await response.text());
        
            return response;
        }

        // ---------- BUTTON EVENTS ----------
        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Select a file first.");

            try {
                const id = await uploadFileToAppData(file, file.name);
                targetFileId.textContent = id;
                manualFileIdInput.value = id;
                alert("Upload complete!");
                listBtn.click(); // Automatically refresh the list
            } catch (err) {
                alert(err.message);
            }
        });

        listBtn.addEventListener('click', async () => {
            try {
                const files = await listAppDataFiles();
                fileList.innerHTML = ''; // Clear current UI items

                if (files.length === 0) {
                    fileList.innerHTML = '<li style="color: gray; list-style-type: none;">No files found in appDataFolder.</li>';
                    return;
                }

                files.forEach(file => {
                    const li = document.createElement('li');
                    li.style.marginBottom = '10px';
                
                    const link = document.createElement('a');
                    link.href = '#';
                    link.textContent = file.name;
                    link.style.color = 'blue';
                    link.style.textDecoration = 'underline';
                
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        manualFileIdInput.value = file.id;
                        previewBtn.click();
                    });

            
                    const downloadBtn = document.createElement('button');
                    downloadBtn.textContent = "Download";
                    downloadBtn.style.marginLeft = "10px";
            
                    downloadBtn.addEventListener("click", async () => {
                        try {
                            const response = await fetchFile(file.id);
                            const blob = await response.blob();
                    
                            const url = URL.createObjectURL(blob);
                    
                            const a = document.createElement("a");
                            a.href = url;
                            a.download = file.name;
                            a.click();
                    
                            URL.revokeObjectURL(url);
                        } catch (err) {
                            alert(err.message);
                        }
                    });


                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = "Delete";
                    deleteBtn.style.marginLeft = "5px";
                    
                    deleteBtn.addEventListener("click", async () => {
                        if (!confirm(`Delete "${file.name}"?`)) {
                            return;
                        }
                    
                        try {
                            await deleteFile(file.id);
                    
                            // Refresh the list
                            listBtn.click();
                    
                            // Clear preview if it was the deleted file
                            if (manualFileIdInput.value === file.id) {
                                manualFileIdInput.value = "";
                                previewImage.style.display = "none";
                                jsonTitle.style.display = "none";
                                jsonPreview.style.display = "none";
                            }
                        } catch (err) {
                            alert(err.message);
                        }
                    });


                    const renameBtn = document.createElement("button");
                    renameBtn.textContent = "Rename";
                    renameBtn.style.marginLeft = "5px";
                    
                    renameBtn.addEventListener("click", async () => {
                        const newName = prompt("New file name:", file.name);
                    
                        if (newName === null) return; // User cancelled
                    
                        const trimmed = newName.trim();
                    
                        if (!trimmed || trimmed === file.name) return;
                    
                        try {
                            await renameFile(file.id, trimmed);
                    
                            // Refresh the list
                            listBtn.click();
                        } catch (err) {
                            alert(err.message);
                        }
                    });


                    const duplicateBtn = document.createElement("button");
                    duplicateBtn.textContent = "Duplicate";
                    duplicateBtn.style.marginLeft = "5px";
                    
                    duplicateBtn.addEventListener("click", async () => {
                        try {
                            await duplicateFile(file);
                    
                            // Refresh the list
                            listBtn.click();
                        } catch (err) {
                            alert(err.message);
                        }
                    });
                
                    const meta = document.createElement('div');
                    meta.style.fontSize = '12px';
                    meta.style.color = '#666';
                
                    const sizeKB = file.size
                        ? (Number(file.size) / 1024).toFixed(1) + ' KB'
                        : 'Unknown';
                
                    meta.innerHTML = `
                        <strong>ID:</strong> ${file.id}<br>
                        <strong>Size:</strong> ${sizeKB}<br>
                        <strong>Type:</strong> ${file.mimeType}<br>
                        <strong>Created:</strong> ${new Date(file.createdTime).toLocaleString()}<br>
                        <strong>Modified:</strong> ${new Date(file.modifiedTime).toLocaleString()}
                    `;
                
                    li.appendChild(link);
                    li.appendChild(downloadBtn);
                    li.appendChild(renameBtn);
                    li.appendChild(duplicateBtn);
                    li.appendChild(deleteBtn);
                    li.appendChild(meta);
                    fileList.appendChild(li);
                });
            } catch (err) {
                alert(err.message);
            }
        });

        previewBtn.addEventListener('click', async () => {
            const fileId = manualFileIdInput.value.trim();
            if (!fileId) return alert("Enter a file ID.");
        
            try {
                const response = await fetchFile(fileId);
        
                const contentType = response.headers.get("Content-Type") || "";
        
                previewImage.style.display = "none";
                jsonTitle.style.display = "none";
                jsonPreview.style.display = "none";
        
                if (
                    contentType.includes("application/json") ||
                    contentType.includes("text/json")
                ) {
                    const json = await response.json();
                    jsonModalTitle.textContent = fileId + ".json";
                    jsonModalContent.textContent = JSON.stringify(json, null, 4);
                    jsonModal.style.display = "flex";
                }
                else if (contentType.startsWith("image/")) {
                    const blob = await response.blob();
                    previewImage.src = URL.createObjectURL(blob);
                    previewImage.style.display = "block";
                }
                else {
                    const text = await response.text();
                    jsonPreview.textContent = text;
                    jsonPreview.style.display = "block";
                }
            }
            catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
